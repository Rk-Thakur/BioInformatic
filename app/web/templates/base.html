<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GE-EHR{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1f2933; background: #f7f9fb; }
    header { background: #12355b; color: #fff; padding: 12px 24px; }
    .advisory { background: #fff4d6; border-bottom: 1px solid #e8c766; padding: 8px 24px; font-size: 14px; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
  </style>
</head>
<body>
  <header><strong>GE-EHR</strong> · Monogenic diabetes decision support</header>
  <div class="advisory">Research prototype · synthetic data only · recommendations are advisory and require specialist review.</div>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
